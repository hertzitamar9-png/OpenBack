# Render Blueprint for OpenBack
# Builds the existing multi-stage Dockerfile (nginx + supervisord + node server).
# Production identity: the public game is served from openback.servegame.com.

databases:
  - name: openback-postgres
    databaseName: openback
    user: openback
    # Free Render Postgres expires after 30 days and has no backups. Permanent
    # player accounts and purchases require a persistent production plan.
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: openback
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render assigns $PORT at runtime; the Dockerfile's start.sh rewrites
    # nginx to listen on it.
    envVars:
      - key: DOMAIN
        value: openback.servegame.com
      - key: PUBLIC_ORIGIN
        value: https://openback.servegame.com
      - key: AUTH_ORIGIN
        value: https://openback.servegame.com
      - key: SHARE_ORIGIN
        value: https://openback.servegame.com
      - key: SUBDOMAIN
        value: main
      - key: GAME_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: openback-postgres
          property: connectionString
      - key: NUM_WORKERS
        value: "1"
      - key: API_KEY
        sync: false
      - key: CUSTOM_TRIBES_URL
        value: http://127.0.0.1:3000
      - key: ADMIN_BOT_API_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        value: 1x00000000000000000000AA
      - key: CDN_BASE
        value: https://openback.servegame.com
      - key: COSMETICS_BASE_URL
        sync: false
    # Do not mark a deployment healthy until permanent storage is reachable.
    healthCheckPath: /auth/health
    autoDeploy: true
